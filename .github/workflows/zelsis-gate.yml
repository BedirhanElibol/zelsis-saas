name: Zelsis AI Release Gate Audit

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  zelsis-release-gate:
    name: Zelsis Production Pre-flight Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js Environment
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Run TypeScript & Security Lint Check
        run: |
          npm ci || npm install
          npx tsc --noEmit

      - name: Trigger Zelsis Release Gate API Audit
        env:
          ZELSIS_API_URL: ${{ secrets.ZELSIS_API_URL || 'https://shipguard-saas.vercel.app/api/v1/gate-check' }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FAIL_OPEN: ${{ vars.ZELSIS_FAIL_OPEN || 'false' }}
        run: |
          echo "🚀 Triggering Zelsis Release Gate Audit for repository: ${{ github.repository }}..."
          
          # Pass ref and base for PRs
          REF=""
          BASE=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            REF="${{ github.event.pull_request.head.sha }}"
            BASE="${{ github.event.pull_request.base.sha }}"
          fi
          
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$ZELSIS_API_URL" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -d "{\"repoUrl\": \"${{ github.repository }}\", \"slackWebhookUrl\": \"$SLACK_WEBHOOK_URL\", \"discordWebhookUrl\": \"$DISCORD_WEBHOOK_URL\", \"ref\": \"$REF\", \"base\": \"$BASE\"}")
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          
          echo "Audit HTTP Status: $HTTP_CODE"
          echo "Audit Response: $BODY"
          
          if [ "$HTTP_CODE" -ge 500 ] || [ -z "$BODY" ] || ! echo "$BODY" | jq -e . >/dev/null 2>&1; then
            echo "❌ Zelsis API unreachable or returned invalid response."
            if [ "$FAIL_OPEN" = "true" ]; then
              echo "⚠️ Fail-open strategy is enabled. Passing the gate."
              exit 0
            else
              echo "🛑 Failing the workflow."
              exit 1
            fi
          fi
          
          GATE_STATUS=$(echo "$BODY" | jq -r '.gateStatus // "FAILED"')
          READINESS_SCORE=$(echo "$BODY" | jq -r '.readinessScore // 0')
          
          echo "--------------------------------------------------"
          echo "📊 Zelsis Gate Status: $GATE_STATUS"
          echo "📊 Production Readiness Score: $READINESS_SCORE%"
          echo "--------------------------------------------------"
          
          if [ "$GATE_STATUS" = "FAILED" ]; then
            echo "❌ Release BLOCKED! Critical security vulnerabilities detected."
            exit 1
          else
            echo "✅ Release Gate PASSED! Application is ready for production deployment."
          fi
