name: Zelsis AI Release Gate Audit

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  zelsis-release-gate:
    name: Zelsis Production Pre-flight Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js Environment
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Run TypeScript & Security Lint Check
        run: |
          npm ci || npm install
          npx tsc --noEmit

      - name: Trigger Zelsis Release Gate API Audit
        env:
          ZELSIS_API_URL: ${{ secrets.ZELSIS_API_URL || 'https://shipguard-saas.vercel.app/api/v1/gate-check' }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          echo "🚀 Triggering Zelsis Release Gate Audit for repository: ${{ github.repository }}..."
          RESPONSE=$(curl -s -X POST "$ZELSIS_API_URL" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -d "{\"repoUrl\": \"${{ github.repository }}\", \"slackWebhookUrl\": \"$SLACK_WEBHOOK_URL\", \"discordWebhookUrl\": \"$DISCORD_WEBHOOK_URL\"}")
          
          echo "Audit Response: $RESPONSE"
          GATE_STATUS=$(echo "$RESPONSE" | jq -r '.gateStatus // "FAILED"')
          READINESS_SCORE=$(echo "$RESPONSE" | jq -r '.readinessScore // 0')
          
          echo "--------------------------------------------------"
          echo "📊 Zelsis Gate Status: $GATE_STATUS"
          echo "📊 Production Readiness Score: $READINESS_SCORE%"
          echo "--------------------------------------------------"
          
          if [ "$GATE_STATUS" = "FAILED" ]; then
            echo "❌ Release BLOCKED! Critical security vulnerabilities detected."
            exit 1
          else
            echo "✅ Release Gate PASSED! Application is ready for production deployment."
          fi
