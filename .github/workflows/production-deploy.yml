name: Production Build & Deployment Pipeline

# PRs into main are verified here; main is not re-run on push (it only receives verified PRs)
on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'marketing-assets/**'
  workflow_dispatch:

# A new push to the same PR cancels the run it replaces
concurrency:
  group: deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    name: Lint, Typecheck, Build & Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 20
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Python Environment
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          npm ci || npm install

      - name: TypeScript Static Typecheck
        run: |
          npx tsc --noEmit

      - name: ESLint
        run: |
          npm run lint

      - name: Build Next.js Application
        run: |
          npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_APP_URL: https://zelsis.com
          PRODUCTION_CLIENT_URL: https://zelsis.com

      - name: Start Production Server in Background
        run: |
          npm start &
          echo "Waiting for server to become healthy on port 3000..."
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:3000/api/v1/gate-check > /dev/null 2>&1; then
              echo "Server is listening and responsive!"
              break
            fi
            sleep 1
          done
        env:
          # e2e traffic all comes from 127.0.0.1; the flag is ignored when VERCEL is set
          ZELSIS_E2E_NO_RATE_LIMIT: '1'
          # Authenticated GitHub API calls so public-repo scans don't hit the shared runner IP's 60/hr limit
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Functional Principles Verification Suite
        run: |
          npm test
        env:
          TEST_BASE_URL: http://127.0.0.1:3000

      - name: Install Playwright Chromium
        timeout-minutes: 12
        # The runner image already ships Chrome: use it so the job needs no apt or CDN download at all (that download
        # hung twice on 2026-10-27 and cost 12 minutes each time). Only install Chromium when Chrome is missing.
        # The retry loop below caps each attempt; timeout only stops npx, so clear the dpkg lock the apt-get kept.
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || true)"
          if [ -n "$CHROME" ]; then
            echo "Using $CHROME for the E2E smoke tests"
            echo "PLAYWRIGHT_CHROMIUM_PATH=$CHROME" >> "$GITHUB_ENV"
            exit 0
          fi
          for attempt in 1 2 3; do
            timeout 240 npx playwright install --with-deps chromium && exit 0
            echo "Playwright install attempt $attempt failed or timed out, retrying"
            sudo pkill -9 -x apt-get || true
            sudo pkill -9 -x dpkg || true
            sudo rm -f /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/lib/apt/lists/lock /var/cache/apt/archives/lock
            sudo dpkg --configure -a || true
          done
          exit 1

      - name: Run E2E Smoke Tests
        run: |
          npm run test:e2e
        env:
          E2E_BASE_URL: http://127.0.0.1:3000

      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
