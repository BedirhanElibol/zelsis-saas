name: Production Build & Deployment Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate-and-build:
    name: Lint, Typecheck, Build & Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Python Environment
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          npm ci || npm install

      - name: TypeScript Static Typecheck
        run: |
          npx tsc --noEmit

      - name: ESLint
        run: |
          npm run lint

      - name: Build Next.js Application
        run: |
          npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_APP_URL: https://zelsis.com
          PRODUCTION_CLIENT_URL: https://zelsis.com

      - name: Start Production Server in Background
        run: |
          npm start &
          echo "Waiting for server to become healthy on port 3000..."
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:3000/api/v1/gate-check > /dev/null 2>&1; then
              echo "Server is listening and responsive!"
              break
            fi
            sleep 1
          done

      - name: Run Functional Principles Verification Suite
        run: |
          npm test
        env:
          TEST_BASE_URL: http://127.0.0.1:3000

      - name: Install Playwright Chromium
        run: |
          npx playwright install --with-deps chromium

      - name: Run E2E Smoke Tests
        run: |
          npm run test:e2e
        env:
          E2E_BASE_URL: http://127.0.0.1:3000

      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
