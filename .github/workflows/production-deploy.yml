name: Production Build & Deployment Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate-and-build:
    name: Lint, Typecheck, Build & Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          npm ci || npm install

      - name: TypeScript Static Typecheck
        run: |
          npx tsc --noEmit

      - name: Build Next.js Application
        run: |
          npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_APP_URL: https://zelsis.com
          PRODUCTION_CLIENT_URL: https://zelsis.com

      - name: Start Production Server in Background
        run: |
          npm start &
          echo "Waiting for server to become healthy on port 3000..."
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:3000/api/v1/gate-check > /dev/null 2>&1; then
              echo "Server is listening and responsive!"
              break
            fi
            sleep 1
          done

      - name: Run Functional Principles Verification Suite
        run: |
          npm test
        env:
          TEST_BASE_URL: http://127.0.0.1:3000
