name: Production Build & Deployment Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate-and-build:
    name: Lint, Typecheck, Build & Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Python Environment
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          npm ci || npm install

      - name: TypeScript Static Typecheck
        run: |
          npx tsc --noEmit

      - name: ESLint
        run: |
          npm run lint

      - name: Build Next.js Application
        run: |
          npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_APP_URL: https://zelsis.com
          PRODUCTION_CLIENT_URL: https://zelsis.com

      - name: Start Production Server in Background
        run: |
          npm start &
          echo "Waiting for server to become healthy on port 3000..."
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:3000/api/v1/gate-check > /dev/null 2>&1; then
              echo "Server is listening and responsive!"
              break
            fi
            sleep 1
          done
        env:
          # e2e traffic all comes from 127.0.0.1; the flag is ignored when VERCEL is set
          ZELSIS_E2E_NO_RATE_LIMIT: '1'
          # Authenticated GitHub API calls so public-repo scans don't hit the shared runner IP's 60/hr limit
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Functional Principles Verification Suite
        run: |
          npm test
        env:
          TEST_BASE_URL: http://127.0.0.1:3000

      - name: Install Playwright Chromium
        timeout-minutes: 12
        # The apt/CDN download occasionally hangs; cap each attempt and retry instead of blocking the job
        run: |
          for attempt in 1 2 3; do
            timeout 240 npx playwright install --with-deps chromium && exit 0
            echo "Playwright install attempt $attempt failed or timed out, retrying"
          done
          exit 1

      - name: Run E2E Smoke Tests
        run: |
          npm run test:e2e
        env:
          E2E_BASE_URL: http://127.0.0.1:3000

      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
