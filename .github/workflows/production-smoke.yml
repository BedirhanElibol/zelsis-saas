name: Production Smoke

# Read-only checks against the live site: pages load, auth/cron/unsubscribe guards reject bad calls,
# badges never fake a pass, and the public scan + gate-check APIs answer. Runs twice a week and when
# Vercel reports a finished production deploy, so there is no idle wait.
on:
  schedule:
    - cron: '23 7 * * 1,4'
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Live site smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Skipped jobs cost no minutes: only successful production deploys run it
    if: github.event_name != 'deployment_status' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run smoke tests against production
        env:
          E2E_BASE_URL: https://shipguard-saas.vercel.app
        run: npx playwright test
