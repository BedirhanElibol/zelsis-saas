name: Rule Benchmark

# Scans the pinned benchmark corpus (scripts/benchmark/corpus.json) and fails when recall drops
# or clean projects get new gate failures compared to data/benchmark-summary.generated.json.
on:
  pull_request:
    paths:
      - 'lib/rules/**'
      - 'lib/scanner/**'
      - 'lib/scanner-engine.ts'
      - 'scripts/benchmark/**'
      - 'data/rule-maturity.generated.json'
      - 'data/benchmark-summary.generated.json'
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Recall & false-positive regression check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache benchmark corpus clones
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/benchmark
          key: benchmark-corpus-${{ hashFiles('scripts/benchmark/corpus.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Run benchmark regression check
        run: npx tsx scripts/benchmark/run.ts --check
