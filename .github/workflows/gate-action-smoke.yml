name: Gate action smoke test

# Runs the composite action in actions/gate against this public repository whenever the action changes,
# so a broken action.yml is caught here and not by a customer.
on:
  pull_request:
    paths:
      - 'actions/gate/**'
      - '.github/workflows/gate-action-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    name: Gate action smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run the action (report only, never fails the gate)
        id: gate
        uses: ./actions/gate
        with:
          fail-on-failed: 'false'
          upload-report: 'false'
      - name: Check the outputs
        env:
          STATUS: ${{ steps.gate.outputs.status }}
          SCORE: ${{ steps.gate.outputs.score }}
        run: |
          echo "status=$STATUS score=$SCORE"
          case "$STATUS" in PASSED|WARNING|FAILED) ;; *) echo "::error::unexpected gate status '$STATUS'"; exit 1 ;; esac
          case "$SCORE" in ''|*[!0-9.]*) echo "::error::score is not a number: '$SCORE'"; exit 1 ;; esac
